            width: 100%;
            height: 500px;
            margin: 0;

#lista::-webkit-scrollbar {

}



        .nivel {
            background-color: #222;

            padding: 20px;

        }

        .posicion {
            font-size: 28px;

            width: 60px;
        }

        .nombre {
            font-weight: bold;
        }

        .nivel img {
            width: 150px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            margin-left: auto;
        }
    </style>
</head>
